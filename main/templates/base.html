{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>
      {% block title %}Compressor34 — компрессоры и запчасти{% endblock %}
    </title>
    <meta
      name="description"
      content="{% block meta_description %}Интернет-магазин Compressor34: компрессоры, запчасти и услуги с доставкой по всей России{% endblock %}"
    />
    <meta
      name="keywords"
      content="{% block meta_keywords %}компрессоры, запчасти, ремонт компрессоров, купить компрессор{% endblock %}"
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="{% block og_title %}Compressor34{% endblock %}"
    />
    <meta
      property="og:description"
      content="{% block og_description %}Компрессоры и запчасти по выгодным ценам{% endblock %}"
    />
    <meta property="og:image" content="{% static 'media/logo.png' %}" />
    <meta property="og:url" content="{{ request.build_absolute_uri }}" />

    <link
      rel="icon"
      href="{% static 'media/favicon.ico' %}"
      type="image/x-icon"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{% static 'css/globals.css' %}" />

    <link rel="stylesheet" href="{% static 'css/footer.css' %}" />
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />

    {% block extra_head %}{% endblock %}
  </head>
  <body>
    {% include "component/header.html" %}
    <div class="content">{% block content %}{% endblock %}</div>
    {% block extra_js %}{% endblock %} {% include "component/footer.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
