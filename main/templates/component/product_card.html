<div class="col">
  <div class="card h-100">
    {% if product.images.first %}
      <img src="{{ product.images.first.image.url }}" alt="{{ product.title }}" 
           class="card-img-top p-3" style="height: 180px; object-fit: contain;">
    {% else %}
      <img src="{% static 'media/nophoto.svg' %}" alt="Нет изображения" 
           class="card-img-top p-3" style="height: 180px; object-fit: contain;">
    {% endif %}

    <div class="card-body d-flex flex-column">
      <h5 class="card-title fs-6" style="min-height: 3em;">{{ product.title }}</h5>

      {% if product.price %}
        <div class="fw-bold fs-5 text-dark mb-3">{{ product.price }} ₽</div>
      {% endif %}

      <div class="mt-auto">
        <div class="d-grid gap-2">
          {% if product.avito_url %}
          <a href="{{ product.avito_url }}" target="_blank" 
             class="btn btn-accent" style="width: 100%;">
            Купить на Авито
          </a>
          {% endif %}
          <a href="{% url 'product_detail' product.slug %}" 
             class="btn btn-outline-primary" style="width: 100%;">
            Подробнее
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
